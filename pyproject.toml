[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioeasy"
version = "0.1.0"
description = "A simple, reproducible command-line toolkit for bioinformatics."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "BioEasy Contributors"}]
keywords = ["bioinformatics", "FASTA", "genomics", "sequence-analysis"]

[project.scripts]
bioeasy = "bioeasy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
